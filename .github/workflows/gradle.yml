name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 关键：PR 下 checkout 会进入 detached HEAD，
      #    git symbolic-ref / git describe 之类的命令就会返回非 0。
      #    显式指定 ref 让它检出到真正的分支。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      # 2. 把 git 环境准备好，避免 build.gradle.kts:41 报错。
      - name: Prepare git repository
        run: |
          set -x

          # 防止文件权限变化把工作区弄脏（git diff --quiet 会返回 1）
          git config core.fileMode false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # 强制同步 tags，确保 git describe 能找到 tag
          git fetch --tags --force --prune origin || true

          # 如果整个仓库一个 tag 都没有，git describe 会直接以退出码 1 失败。
          # 这里在 HEAD 上打一个本地 fallback tag，让 describe 至少能返回东西。
          if [ -z "$(git tag -l)" ]; then
            echo "No tags found, creating fallback tag v0.0.0"
            git tag -a v0.0.0 -m "CI fallback tag" HEAD
          fi

          # 明确切到分支（防止 detached HEAD 造成 symbolic-ref 失败）
          git checkout -B ci-build || true

          # 打印所有 build.gradle.kts 里可能会用到的 git 命令，方便定位
          echo "===== git status --short ====="
          git status --short
          echo "===== git rev-parse --abbrev-ref HEAD ====="
          git rev-parse --abbrev-ref HEAD || echo "exit=$?"
          echo "===== git symbolic-ref --short HEAD ====="
          git symbolic-ref --short HEAD || echo "exit=$?"
          echo "===== git describe --tags ====="
          git describe --tags || echo "exit=$?"
          echo "===== git describe --tags --always --dirty ====="
          git describe --tags --always --dirty || echo "exit=$?"
          echo "===== git rev-parse --short HEAD ====="
          git rev-parse --short HEAD || echo "exit=$?"
          echo "===== git diff --quiet ====="
          git diff --quiet; echo "exit=$?"
          echo "===== git tag -l ====="
          git tag -l

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3. 直接 bash 执行 wrapper，避免 chmod 修改工作区
      - name: Build
        run: bash ./gradlew build --full-stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            **/build/libs/*.war
            **/build/outputs/**/*.aar
            **/build/distributions/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
