name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 防止文件权限变化导致 git 认为工作区脏
      - name: Ignore file mode changes
        run: git config core.fileMode false

      # 可选：打印 git 信息，方便定位 build.gradle.kts:41 的 git 命令
      - name: Show git info
        run: |
          git status --short
          git log --oneline -5
          git describe --tags --always --dirty

      # 不再 chmod +x，直接使用 bash 执行 wrapper，避免修改工作区
      - name: Build
        run: bash ./gradlew build --full-stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            **/build/libs/*.war
            **/build/outputs/**/*.aar
            **/build/distributions/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
