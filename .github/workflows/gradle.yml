name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare git repository
        run: |
          set -x

          # 防止权限变化把工作区弄脏
          git config core.fileMode false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # CI 里没有 git 身份，打 tag / commit 会失败，先配置好
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 同步远端 tags
          git fetch --tags --force --prune origin || true

          # 如果仓库一个 tag 都没有，git describe 会以退出码 1 失败。
          # 在 HEAD 上打一个轻量 tag 作为兜底。
          if [ -z "$(git tag -l)" ]; then
            echo "No tags found, creating fallback tag v0.0.0"
            git tag v0.0.0 HEAD
          fi

          # 明确切到分支，防止 detached HEAD 造成 symbolic-ref 失败
          git checkout -B ci-build || true

          # 打印所有 build.gradle.kts 里可能用到的 git 命令，方便定位
          echo "===== git status --short ====="
          git status --short
          echo "===== git rev-parse --abbrev-ref HEAD ====="
          git rev-parse --abbrev-ref HEAD || echo "exit=$?"
          echo "===== git symbolic-ref --short HEAD ====="
          git symbolic-ref --short HEAD || echo "exit=$?"
          echo "===== git describe --tags ====="
          git describe --tags || echo "exit=$?"
          echo "===== git describe --tags --always --dirty ====="
          git describe --tags --always --dirty || echo "exit=$?"
          echo "===== git rev-parse --short HEAD ====="
          git rev-parse --short HEAD || echo "exit=$?"
          echo "===== git diff --quiet ====="
          git diff --quiet; echo "exit=$?"
          echo "===== git tag -l ====="
          git tag -l

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: bash ./gradlew build --full-stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            **/build/libs/*.war
            **/build/outputs/**/*.aar
            **/build/distributions/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
